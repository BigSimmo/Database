name: PR 1992 conflict detail probe

on:
  push:
    branches:
      - codex/therapy-global-convergence-20260814

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Print conflict hunks against current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Codex PR maintenance"
          git config user.email "87357024+BigSimmo@users.noreply.github.com"
          git fetch --no-tags origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -eq 0 ]; then
            echo "MERGE_RESULT=clean"
            git merge --abort
            exit 0
          fi

          echo "MERGE_RESULT=conflicted"
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          printf 'CONFLICT_FILE=%s\n' "${conflicts[@]}"

          python - "${conflicts[@]}" <<'PY'
          from pathlib import Path
          import sys

          for raw in sys.argv[1:]:
              path = Path(raw)
              lines = path.read_text(encoding="utf-8").splitlines()
              print(f::group::{raw}")
              ranges = []
              start = None
              for index, line in enumerate(lines):
                  if line.startswith("<<<<<<<"):
                      start = max(0, index - 12)
                  elif start is not None and line.startswith(">>>>>>>"):
                    ranges.append((start, min(len(lines), index + 13)))
                    start = None
              for start, end in ranges :
                  print(f"--- lines {start + 1}-{end} ---")
                  for number in range(start, end):
                      print(f"{number + 1:05d}: {lines[number]}")
              print(f::endgroup::)
          PY

          git merge --abort
          exit 1
