name: PR 1992 conflict detail probe

on:
  push:
    branches:
      - codex/therapy-global-convergence-20260814

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Print conflict hunks against current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Codex PR maintenance"
          git config user.email "87357024+BigSimmo@users.noreply.github.com"
          git fetch --no-tags origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -eq 0 ]; then
            echo "MERGE_RESULT=clean"
            git merge --abort
            exit 0
          fi

          echo "MERGE_RESULT=conflicted"
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          printf 'CONFLICT_FILE=%s\n' "${conflicts[@]}"

          for path in "${conflicts[@]}"; do
            echo "FILE_BEGIN=$path"
            git diff --cc --unified=25 -- "$path"
            echo "FILE_END=$path"
          done

          git merge --abort
          exit 1
