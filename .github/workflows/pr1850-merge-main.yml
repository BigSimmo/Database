name: PR 1850 native main merge

on:
  push:
    branches:
      - codex/find-cause-of-menu-regression

concurrency:
  group: pr1850-native-main-merge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  merge-current-main:
    if: ${{ !contains(github.event.head_commit.message, 'merge(main): resolve PR #1850 conflicts') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout triggering PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Merge current main and resolve only known conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          before_head="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          echo "PR head before merge: ${before_head}"
          echo "Current main: ${main_sha}"

          grep -E '^\| [^|]+ \| (origin/pr/1850|1850) \|' docs/branch-review-ledger.md > /tmp/pr1850-ledger-rows.txt || true

          python - <<'PY'
          from pathlib import Path

          path = Path("tests/ui-smoke.spec.ts")
          text = path.read_text()
          start_marker = "    // Regression guard for #1802:"
          end_marker = "    expect(parentNodeErrors).toEqual([]);"
          if start_marker not in text:
              raise SystemExit("PR #1850 browser regression block is missing before merge")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          Path("/tmp/pr1850-ui-block.txt").write_text(text[start:end])
          PY

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "No merge commit was required; branch is already current."
            exit 0
          fi

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          if [ "${merge_status}" -ne 0 ]; then
            printf 'Unmerged paths: %s\n' "${conflicts[*]:-(none)}"
          fi

          for path in "${conflicts[@]}"; do
            case "${path}" in
              docs/branch-review-ledger.md|tests/ui-smoke.spec.ts)
                ;;
              *)
                echo "Unexpected merge conflict: ${path}" >&2
                exit 1
                ;;
            esac
          done

          if printf '%s\n' "${conflicts[@]}" | grep -Fxq 'docs/branch-review-ledger.md'; then
            git checkout --theirs -- docs/branch-review-ledger.md
          fi

          while IFS= read -r row; do
            [ -z "${row}" ] && continue
            grep -Fqx -- "${row}" docs/branch-review-ledger.md || printf '%s\n' "${row}" >> docs/branch-review-ledger.md
          done < /tmp/pr1850-ledger-rows.txt
          git add docs/branch-review-ledger.md

          if printf '%s\n' "${conflicts[@]}" | grep -Fxq 'tests/ui-smoke.spec.ts'; then
            git checkout --theirs -- tests/ui-smoke.spec.ts
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path("tests/ui-smoke.spec.ts")
          text = path.read_text()
          marker = "    // Regression guard for #1802:"
          if marker not in text:
              block = Path("/tmp/pr1850-ui-block.txt").read_text()
              test_marker = '  test("prescribing workflow uses in-app medication routes @critical"'
              anchor = '    await expect(page.getByRole("link", { name: "Back to medications" }).filter({ visible: true })).toBeVisible();\n\n'
              test_start = text.index(test_marker)
              anchor_start = text.index(anchor, test_start)
              insert_at = anchor_start + len(anchor)
              text = text[:insert_at] + block + text[insert_at:]
              path.write_text(text)
          PY
          git add tests/ui-smoke.spec.ts

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Merge still has unresolved files:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          grep -Fq 'factsheets-view-toolbar' tests/ui-smoke.spec.ts
          grep -Fq 'Regression guard for #1802' tests/ui-smoke.spec.ts
          grep -Eq '^\| [^|]+ \| (origin/pr/1850|1850) \|' docs/branch-review-ledger.md
          git diff --cached --check

          npm ci --ignore-scripts
          node scripts/check-installed-lock-parity.mjs --write-stamp
          npm run check:branch-review-ledger
          npm test -- --run tests/in-page-nav-route-sections.dom.test.tsx
          npx prettier --check \
            docs/design-system/adoption-manifest.json \
            src/components/clinical-dashboard/medication-nav-header.tsx \
            src/components/in-page-nav/in-page-nav-header.tsx \
            src/components/in-page-nav/in-page-section-rail.tsx \
            tests/in-page-nav-route-sections.dom.test.tsx \
            tests/ui-smoke.spec.ts

          git commit -m "merge(main): resolve PR #1850 conflicts"
          git merge-base --is-ancestor "${before_head}" HEAD
          git merge-base --is-ancestor "${main_sha}" HEAD
          git show --stat --oneline --summary HEAD
          git push origin HEAD:refs/heads/codex/find-cause-of-menu-regression
