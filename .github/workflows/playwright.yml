name: Cross-Browser Playwright Matrix

on:
  schedule:
    - cron: "0 5 * * 0" # Sunday at 5:00 UTC
  workflow_dispatch:

concurrency:
  group: playwright-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-matrix:
    name: Playwright Tests (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Do not reuse setup-ui-e2e here: that composite only installs Chromium.
      # This matrix must install the selected browser + its system deps.
      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node-cached

      - name: Restore browser cache
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.project }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps ${{ matrix.project }}
            npx playwright install ${{ matrix.project }}
          else
            npx playwright install --with-deps ${{ matrix.project }}
          fi

      - name: Run Playwright suite
        run: node scripts/run-playwright.mjs --project=${{ matrix.project }}

      - name: Classify exact failed test identities
        if: failure()
        run: node scripts/classify-playwright-failures.mjs

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-${{ matrix.project }}-diagnostics-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
