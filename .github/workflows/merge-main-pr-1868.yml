name: Merge latest main into PR 1868

on:
  push:
    branches:
      - codex/windows-test-portability
    paths:
      - .github/workflows/merge-main-pr-1868.yml

permissions:
  contents: write

concurrency:
  group: merge-main-pr-1868
  cancel-in-progress: false

jobs:
  merge:
    if: github.repository == 'BigSimmo/Database'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: codex/windows-test-portability
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Merge reviewed main tip
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "931d467033edfd9807487388ed659984a4a04540"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "5ff9b76950b887c0b66c7b6d42405a325f3be339"

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          for conflict in "${conflicts[@]}"; do
            if [[ "$conflict" != "docs/branch-review-ledger.md" ]]; then
              echo "Unexpected merge conflict: $conflict" >&2
              exit 1
            fi
          done
          if [[ $merge_status -ne 0 && ${#conflicts[@]} -eq 0 ]]; then
            echo "Merge failed without an inspectable conflict set." >&2
            exit 1
          fi

          if printf '%s\n' "${conflicts[@]}" | grep -Fxq docs/branch-review-ledger.md; then
            git show :2:docs/branch-review-ledger.md > /tmp/ledger-ours.md
            git show :3:docs/branch-review-ledger.md > /tmp/ledger-main.md
            python <<'PY'
          from pathlib import Path

          ours = Path("/tmp/ledger-ours.md").read_text(encoding="utf-8").splitlines()
          main = Path("/tmp/ledger-main.md").read_text(encoding="utf-8").splitlines()
          marker = "| PR #1868 / codex/windows-test-portability |"
          rows = [line for line in ours if marker in line]
          if len(rows) != 1:
              raise SystemExit(f"Expected one PR #1868 ledger row in branch stage, found {len(rows)}")
          if any(marker in line for line in main):
              raise SystemExit("Current main unexpectedly already contains the PR #1868 ledger row")
          merged = main + [rows[0]]
          Path("docs/branch-review-ledger.md").write_text("\n".join(merged) + "\n", encoding="utf-8")
          PY
            git add docs/branch-review-ledger.md
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          grep -Fq '| PR #1868 / codex/windows-test-portability |' docs/branch-review-ledger.md

      - name: Install locked dependencies
        run: npm ci --include=dev --prefer-offline --no-audit --no-fund

      - name: Verify merged tree
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/measure-cls-attribution.mjs
          npx eslint \
            scripts/measure-cls-attribution.mjs \
            tests/measure-cls-attribution-contract.test.ts \
            tests/codex-cloud-setup.test.ts
          npx vitest run \
            tests/measure-cls-attribution-contract.test.ts \
            tests/codex-cloud-setup.test.ts \
            tests/server-identity-contract.test.ts \
            tests/middleware-project-header.test.ts
          npm run check:branch-review-ledger
          git diff --check

      - name: Remove helper, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/merge-main-pr-1868.yml
          git add --all
          git diff --cached --check
          git commit -m "Merge latest main into PR 1868"
          git push origin HEAD:codex/windows-test-portability
