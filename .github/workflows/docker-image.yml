name: Docker image build

# Validates that the production app and worker images build cleanly from the
# tree — the deploy contract in docs/deployment-architecture.md ("Images are
# built from main"). Runs the exact `npm ci` + `next build` the Railway deploy
# runs, on a runner with enough memory for the build's 8 GiB heap (local Docker
# Desktop OOMs on this build; GitHub runners and Railway's remote builder have
# enough headroom).
#
# Pull requests and merge queues call this workflow from CI when the repository's
# container scope changes, so the result feeds the required `pr-required`
# aggregate. Standalone runs cover main/release pushes, the weekly schedule, and
# manual dispatch. Nothing is pushed to a registry.

on:
  workflow_call:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

concurrency:
  # Use a workflow-specific literal. In a reusable invocation `github.workflow`
  # is the caller's name, which would collide with and cancel the parent CI run.
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build app image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          push: false
          # The publishable key is public-by-design and only inlines into the
          # client bundle, so the CI placeholder is enough to validate the build.
          # Real production images are built with the real key at deploy time.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://sjrfecxgysukkwxsowpy.supabase.co
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=placeholder-ci-publishable-key
            # Exercise a matched lowered limit, not only the 150 MB defaults.
            MAX_UPLOAD_MB=50
            NEXT_PUBLIC_MAX_UPLOAD_MB=50
            ALLOW_LOW_RAM_BUILD=1

  worker-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build worker image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.worker
          push: false
