name: Patch PR 1868 verifier

on:
  push:
    branches:
      - codex/windows-test-portability
    paths:
      - .github/workflows/patch-pr-1868-verifier.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'BigSimmo/Database'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: codex/windows-test-portability
          persist-credentials: false

      - name: Build corrected verifier blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          from pathlib import Path

          path = Path('.github/workflows/build-pr-1868-review-fixes-v2.yml')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'test "$(git rev-parse HEAD^)" = "aa49af34c0089cb3ef08c913d5c1853afa5a6dbb"',
                  f'test "$(git rev-parse HEAD^)" = "{os.environ["GITHUB_SHA"]}"',
                  'parent guard',
              ),
              (
                  "grep -E '\\.(?:[cm]?[jt]s|[jt]sx)$' || true",
                  "grep -E '\\.(cjs|mjs|js|jsx|cts|mts|ts|tsx)$' || true",
                  'changed-code selector',
              ),
              (
                  "grep -E '^tests/.*\\.(?:test|spec)\\.[jt]sx?$' || true",
                  "grep -E '^tests/.*\\.(test|spec)\\.(js|jsx|ts|tsx)$' || true",
                  'changed-test selector',
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          payload="$(base64 -w 0 .github/workflows/build-pr-1868-review-fixes-v2.yml | jq -Rs '{ content: ., encoding: "base64" }')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            --data "$payload")"
          sha="$(jq -r '.sha // empty' <<<"$response")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid blob response: $response" >&2
            exit 1
          }
          echo "CORRECTED_VERIFIER_BLOB $sha"
