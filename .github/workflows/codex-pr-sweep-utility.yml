name: Codex PR sweep utility

on:
  push:
    branches:
      - codex/finalize-tooling-follow-through-documentation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install formatter
        run: npm ci --include=dev --ignore-scripts

      - name: Format blocked documentation and export merge diagnostics
        shell: bash
        run: |
          set -euo pipefail

          out=/tmp/codex-pr-sweep
          mkdir -p "$out/formatted"

          npx prettier --write docs/plans/edge-ingestion-overhaul-3pr-plan.md
          cp docs/plans/edge-ingestion-overhaul-3pr-plan.md "$out/formatted/edge-ingestion-overhaul-3pr-plan.md"
          git diff -- docs/plans/edge-ingestion-overhaul-3pr-plan.md > "$out/formatted/prettier.patch"

          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/codex/therapy-global-convergence-20260814:refs/remotes/origin/codex/therapy-global-convergence-20260814 \
            +refs/heads/codex/filter-system-overhaul:refs/remotes/origin/codex/filter-system-overhaul

          copy_paths() {
            local ref="$1"
            local list="$2"
            local destination="$3"
            local path
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              if git cat-file -e "$ref:$path" 2>/dev/null; then
                mkdir -p "$destination/$(dirname "$path")"
                git show "$ref:$path" > "$destination/$path"
              fi
            done < "$list"
          }

          diagnose_merge() {
            local name="$1"
            local head_ref="$2"
            local main_ref=refs/remotes/origin/main
            local base
            local merge_output
            local merge_status
            local merge_tree
            local changed="$out/$name-changed-files.txt"

            base=$(git merge-base "$main_ref" "$head_ref")
            git diff --name-only "$base..$head_ref" > "$changed"

            set +e
            merge_output=$(git merge-tree --write-tree --name-only --messages "$main_ref" "$head_ref" 2>&1)
            merge_status=$?
            set -e

            printf '%s\n' "$merge_output" > "$out/$name-merge-tree.txt"
            merge_tree=$(printf '%s\n' "$merge_output" | head -n 1 | tr -d '\r')
            {
              printf 'main=%s\n' "$(git rev-parse "$main_ref")"
              printf 'head=%s\n' "$(git rev-parse "$head_ref")"
              printf 'base=%s\n' "$base"
              printf 'merge_status=%s\n' "$merge_status"
              printf 'merge_tree=%s\n' "$merge_tree"
            } > "$out/$name-refs.txt"

            copy_paths "$base" "$changed" "$out/$name/base"
            copy_paths "$main_ref" "$changed" "$out/$name/main"
            copy_paths "$head_ref" "$changed" "$out/$name/head"
            if git cat-file -e "$merge_tree^{tree}" 2>/dev/null; then
              copy_paths "$merge_tree" "$changed" "$out/$name/merged"
            fi
          }

          diagnose_merge pr1992 refs/remotes/origin/codex/therapy-global-convergence-20260814
          diagnose_merge pr1998 refs/remotes/origin/codex/filter-system-overhaul

      - name: Upload utility output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-pr-sweep-${{ github.sha }}
          path: /tmp/codex-pr-sweep
          if-no-files-found: error
          retention-days: 1
