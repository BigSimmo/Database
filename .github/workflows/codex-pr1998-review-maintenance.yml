name: Codex PR 1998 merge conflict inspection

on:
  push:
    branches:
      - codex/pr1998-review-maintenance

concurrency:
  group: codex-pr1998-conflict-inspection
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'BigSimmo/Database'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        file:
          - .design-sync/config.json
          - docs/filter-contract.md
          - src/components/services/services-navigator-page.tsx
          - src/components/ui/sheet.tsx
          - tests/sheet.dom.test.tsx
          - tests/ui-tools.spec.ts
    env:
      TARGET_BRANCH: codex/filter-system-overhaul
      EXPECTED_HEAD: 3c9a2cb56cb45a1297dc39e51dc4aa3113ec56c9
      FILE: ${{ matrix.file }}
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reproduce and print one conflict
        shell: bash
        run: |
          set -euo pipefail
          cp codex/pr-1998.patch /tmp/pr-1998.patch
          git fetch --no-tags origin "$TARGET_BRANCH" main
          actual_head="$(git rev-parse "origin/$TARGET_BRANCH")"
          test "$actual_head" = "$EXPECTED_HEAD" || {
            echo "::error::PR head drifted: $actual_head != $EXPECTED_HEAD"
            exit 1
          }
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          git apply --check --whitespace=error-all /tmp/pr-1998.patch
          git apply --whitespace=error-all /tmp/pr-1998.patch
          git config user.name "Codex"
          git config user.email "87357024+BigSimmo@users.noreply.github.com"
          git add \
            src/components/clinical-dashboard/document-search-results.tsx \
            src/components/clinical-dashboard/favourites-command-library-page.tsx \
            src/components/clinical-dashboard/result-filter-control.tsx \
            tests/document-filter-panel.dom.test.tsx \
            tests/filter-review-regressions.dom.test.tsx
          git commit -m "fix(filters): close review regressions"
          set +e
          git merge --no-ff --no-commit origin/main >/tmp/merge-output.txt 2>&1
          merge_status=$?
          set -e
          cat /tmp/merge-output.txt
          if test "$merge_status" -eq 0; then
            echo "No merge conflict."
            exit 0
          fi
          if ! git diff --name-only --diff-filter=U | grep -Fxq "$FILE"; then
            echo "$FILE is not conflicted in this reproduction."
            exit 0
          fi
          git checkout --conflict=diff3 -- "$FILE"
          python3 - "$FILE" <<'PY'
          from __future__ import annotations

          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()
          starts = [index for index, line in enumerate(lines) if line.startswith("<<<<<<< ")]
          print(f"===== {path} | conflicts={len(starts)} =====")
          for number, start in enumerate(starts, 1):
              end = start
              while end < len(lines) and not lines[end].startswith(">>>>>>> "):
                  end += 1
              if end >= len(lines):
                  end = len(lines) - 1
              lo = max(0, start - 35)
              hi = min(len(lines), end + 36)
              print(f"\n--- conflict {number}: lines {start + 1}-{end + 1}; context {lo + 1}-{hi} ---")
              for index in range(lo, hi):
                  print(f"{index + 1:05d}: {lines[index]}")
          PY
          echo "===== stage metadata ====="
          git ls-files -u -- "$FILE"
