name: Codex PR 1998 review verification

on:
  push:
    branches:
      - codex/pr1998-review-maintenance

concurrency:
  group: codex-pr1998-review-maintenance
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    if: github.repository == 'BigSimmo/Database'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: codex/filter-system-overhaul
      KNOWN_ANCESTOR: 3c9a2cb56cb45a1297dc39e51dc4aa3113ec56c9
      EXPECTED_SOURCE_BLOB: b711421c25f7c50fd81786249e31ac2cc7ccfee1
      EXPECTED_TEST_BLOB: 97f21fa89037f958b82eb9cb0b16741fec302727
      EXPECTED_REVIEW_TEST_BLOB: 9423590c5a4c7723907d52fd4d2d41e6b6b7b897
      SOURCE_PATH: src/components/clinical-dashboard/document-search-results.tsx
      TEST_PATH: tests/document-filter-panel.dom.test.tsx
      REVIEW_TEST_PATH: tests/filter-review-regressions.dom.test.tsx
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate current PR state and apply authored tests locally
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp codex/pr-1998.patch /tmp/pr-1998.patch
          git fetch --no-tags origin "$TARGET_BRANCH" main
          target_sha="$(git rev-parse "origin/$TARGET_BRANCH")"
          git merge-base --is-ancestor "$KNOWN_ANCESTOR" "$target_sha" || {
            echo "::error::Target branch no longer descends from reviewed head $KNOWN_ANCESTOR."
            exit 1
          }
          source_blob="$(git rev-parse "$target_sha:$SOURCE_PATH")"
          test_blob="$(git rev-parse "$target_sha:$TEST_PATH")"
          review_test_blob="$(git rev-parse "$target_sha:$REVIEW_TEST_PATH")"
          test "$source_blob" = "$EXPECTED_SOURCE_BLOB" || {
            echo "::error::$SOURCE_PATH changed after review ($source_blob != $EXPECTED_SOURCE_BLOB)."
            exit 1
          }
          test "$test_blob" = "$EXPECTED_TEST_BLOB" || {
            echo "::error::$TEST_PATH changed after review ($test_blob != $EXPECTED_TEST_BLOB)."
            exit 1
          }
          test "$review_test_blob" = "$EXPECTED_REVIEW_TEST_BLOB" || {
            echo "::error::$REVIEW_TEST_PATH changed after review ($review_test_blob != $EXPECTED_REVIEW_TEST_BLOB)."
            exit 1
          }
          pr_json="$({
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/1998"
          })"
          auto_merge_state="$(jq -r 'if (.auto_merge // null) == null then "none" else "armed" end' <<<"$pr_json")"
          auto_merge_actor="$(jq -r '.auto_merge.enabled_by.login // "unknown"' <<<"$pr_json")"
          echo "PR head: $target_sha"
          echo "Auto-merge state: $auto_merge_state (enabled by: $auto_merge_actor)"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          git apply --check --whitespace=error-all /tmp/pr-1998.patch
          git apply --whitespace=error-all /tmp/pr-1998.patch
          git diff --check

      - name: Setup Node and install immutable dependencies
        uses: ./.github/actions/setup-node-cached

      - name: Format and check focused files
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/prettier --write \
            tests/document-filter-panel.dom.test.tsx \
            tests/filter-review-regressions.dom.test.tsx
          ./node_modules/.bin/prettier --check \
            src/components/clinical-dashboard/document-search-results.tsx \
            tests/document-filter-panel.dom.test.tsx \
            tests/filter-review-regressions.dom.test.tsx
          git diff --check

      - name: Run focused provider-free filter regressions
        shell: bash
        run: |
          set -euo pipefail
          npm test -- \
            tests/filter-review-regressions.dom.test.tsx \
            tests/document-filter-panel.dom.test.tsx \
            tests/differential-stream-page.dom.test.tsx \
            tests/medication-prescribing-workspace.dom.test.tsx

      - name: Run source typecheck
        run: npm run typecheck

      - name: Run UI design-system contract
        run: npm run check:design-system-contract

      - name: Create local focused test commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Codex"
          git config user.email "87357024+BigSimmo@users.noreply.github.com"
          git add \
            tests/document-filter-panel.dom.test.tsx \
            tests/filter-review-regressions.dom.test.tsx
          git diff --cached --check
          git commit -m "test(filters): cover document projections and medication hydration"

      - name: Merge current main locally without rewriting history
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if git merge --no-ff --no-commit origin/main; then
            if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
            else
              echo "merged=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::group::Merge conflicts"
            git status --short
            while IFS= read -r file; do
              test -n "$file" || continue
              echo "===== $file ====="
              git checkout --conflict=diff3 -- "$file" || true
              sed -n '1,360p' "$file" || true
            done < <(git diff --name-only --diff-filter=U)
            echo "::endgroup::"
            exit 1
          fi

      - name: Refresh dependencies after local main merge
        if: steps.merge.outputs.merged == 'true'
        uses: ./.github/actions/setup-node-cached

      - name: Verify locally merged branch
        if: steps.merge.outputs.merged == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/prettier --check \
            src/components/clinical-dashboard/document-search-results.tsx \
            tests/document-filter-panel.dom.test.tsx \
            tests/filter-review-regressions.dom.test.tsx
          npm test -- \
            tests/filter-review-regressions.dom.test.tsx \
            tests/document-filter-panel.dom.test.tsx \
            tests/differential-stream-page.dom.test.tsx \
            tests/medication-prescribing-workspace.dom.test.tsx
          npm run typecheck
          npm run check:design-system-contract
          git diff --check
          git status --short
          git log --oneline --decorate -5

      - name: Record that no PR mutation occurred
        if: always()
        run: echo "Verification only; the PR branch and auto-merge state were not changed."
