name: PR 1992 format repair

on:
  push:
    branches:
      - codex/therapy-global-convergence-20260814

permissions:
  contents: write

concurrency:
  group: pr-1992-format-repair
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format only the two CI-reported files
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            src/components/account-data-provider.tsx \
            tests/favourites-account-retry.dom.test.tsx
          npx prettier --check \
            src/components/account-data-provider.tsx \
            tests/favourites-account-retry.dom.test.tsx
          rm .github/workflows/pr1992-format.yml

      - name: Commit and push formatting repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Codex PR maintenance"
          git config user.email "87357024+BigSimmo@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: format favourite serialization regressions"
          git push origin HEAD:codex/therapy-global-convergence-20260814
