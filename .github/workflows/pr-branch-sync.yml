name: Sync open PR branches

# When main moves, open PR heads go stale and GitHub often reports them as
# CONFLICTING/DIRTY even when a clean merge exists. That blocks squash
# auto-merge and creates a perpetual "merge conflict" churn across the queue.
#
# This workflow updates every open same-repo PR branch from main after each
# push to main (and on manual dispatch). It uses GitHub's update-branch API
# (merge commit into the head), never rebases, and never merges PRs into main.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: sync-open-pr-branches
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Update behind PR branches
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Update open PR branches from main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = "main";
            const skipLabels = new Set(["hold", "do-not-merge", "skip-branch-sync"]);

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              base,
              per_page: 100,
            });

            const results = { updated: [], skipped: [], failed: [] };

            for (const pr of pulls) {
              const labels = new Set((pr.labels || []).map((l) => String(l.name || "").toLowerCase()));
              const title = String(pr.title || "");
              const headRepo = pr.head?.repo?.full_name;
              const reasonSkip =
                headRepo && headRepo !== `${owner}/${repo}`
                  ? "fork-head"
                  : [...skipLabels].find((l) => labels.has(l))
                    ? `label:${[...skipLabels].find((l) => labels.has(l))}`
                    : /\b(WIP|do not merge)\b/i.test(title)
                      ? "wip-title"
                      : null;
              if (reasonSkip) {
                results.skipped.push(`#${pr.number} ${reasonSkip}`);
                continue;
              }

              // Cheap behind check — avoid update-branch noise when already current.
              let behindBy = null;
              try {
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${base}...${pr.head.ref}`,
                });
                behindBy = comparison.data.behind_by ?? 0;
              } catch (error) {
                results.failed.push(`#${pr.number} compare:${error.status || error.message}`);
                continue;
              }
              if (behindBy === 0) {
                results.skipped.push(`#${pr.number} already-current`);
                continue;
              }

              try {
                await github.rest.pulls.updateBranch({
                  owner,
                  repo,
                  pull_number: pr.number,
                  expected_head_sha: pr.head.sha,
                });
                results.updated.push(`#${pr.number} behind=${behindBy}`);
                core.info(`Updated #${pr.number} (${pr.head.ref}) from ${base} (was behind ${behindBy})`);
              } catch (error) {
                const status = error.status || "err";
                const msg = error.message || String(error);
                // 422 = not behind / merge conflict / head moved — report, do not fail the job.
                results.failed.push(`#${pr.number} ${status}:${msg.split("\n")[0]}`);
                core.warning(`Could not update #${pr.number}: ${status} ${msg}`);
              }

              // Small pacing to reduce secondary-rate-limit pressure on large queues.
              await new Promise((r) => setTimeout(r, 500));
            }

            core.summary
              .addHeading("Open PR branch sync")
              .addRaw(
                [
                  `Updated: ${results.updated.length}`,
                  `Skipped: ${results.skipped.length}`,
                  `Failed/blocked: ${results.failed.length}`,
                  "",
                  results.updated.length ? `### Updated\n${results.updated.map((x) => `- ${x}`).join("\n")}` : "",
                  results.failed.length ? `### Failed/blocked\n${results.failed.map((x) => `- ${x}`).join("\n")}` : "",
                ]
                  .filter(Boolean)
                  .join("\n"),
              )
              .write();

            // Soft-success: real conflicts need humans; stale behind heads are the happy path.
            if (results.failed.some((line) => /5\d\d:/.test(line))) {
              core.setFailed("One or more PR branch updates failed with a server error.");
            }
