name: Keep PR auto-merge enabled

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, auto_merge_disabled]

concurrency:
  group: keep-pr-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ensure:
    name: Ensure auto-merge
    if: github.event.pull_request.state == 'open' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge when missing
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const number = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const data = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    id
                    state
                    isDraft
                    autoMergeRequest { mergeMethod }
                  }
                }
              }`,
              { owner, repo, number },
            );

            const pullRequest = data.repository.pullRequest;
            if (!pullRequest || pullRequest.state !== "OPEN" || pullRequest.isDraft) {
              core.notice(`PR #${number} is closed or draft; auto-merge guard skipped.`);
              return;
            }

            if (pullRequest.autoMergeRequest) {
              core.notice(`PR #${number} already has auto-merge enabled.`);
              return;
            }

            const enabled = await github.graphql(
              `mutation($input: EnablePullRequestAutoMergeInput!) {
                enablePullRequestAutoMerge(input: $input) {
                  pullRequest { number autoMergeRequest { mergeMethod } }
                }
              }`,
              {
                input: {
                  pullRequestId: pullRequest.id,
                  mergeMethod: "MERGE",
                },
              },
            );

            core.notice(
              `Enabled auto-merge for PR #${enabled.enablePullRequestAutoMerge.pullRequest.number}.`,
            );
