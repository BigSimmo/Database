name: PR 1846 Review Fixes

on:
  push:
    branches:
      - claude/filter-popup-design-mockups-x6sbjv

concurrency:
  group: pr1846-review-fixes
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/filter-popup-design-mockups-x6sbjv
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.ledger.driver 'node scripts/merge-branch-review-ledger.mjs %O %A %B'
          git config merge.ledger.name 'branch-review-ledger union with exact-row dedupe'
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            echo "Unexpected unresolved conflicts:"
            printf '%s\n' "$conflicts"
            exit 1
          fi

      - name: Apply review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          component_path = Path("src/components/filter-sheet-restyle-mockups.tsx")
          readme_path = Path("mockups/README.md")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          component = component_path.read_text(encoding="utf-8")
          component = replace_once(
              component,
              'import { useCallback, useMemo, useState } from "react";',
              'import { useCallback, useId, useMemo, useState } from "react";',
              "React useId import",
          )
          component = replace_once(
              component,
              ' * hardest: two groups, sixteen options, and the longest title in the app\n',
              ' * hardest: four domain themes, twelve domains, twelve mechanisms, four presets,\n * thirteen domain chips, and the longest title in the app\n',
              "component header specimen counts",
          )
          component = replace_once(
              component,
              '              compact ? "min-h-11" : "min-h-9",',
              '              compact ? "min-h-tap" : "min-h-9",',
              "phone scope segment target",
          )
          component = replace_once(
              component,
              '  const empty = count === 0 && !selected;\n  return (\n    <button\n      type="button"\n      role="checkbox"\n      aria-checked={selected}\n      aria-describedby={empty ? `${domain}-empty` : undefined}',
              '  const empty = count === 0 && !selected;\n  const emptyId = `${useId()}-empty`;\n  return (\n    <button\n      type="button"\n      role="checkbox"\n      aria-checked={selected}\n      aria-describedby={empty ? emptyId : undefined}',
              "DomainChip unique description id",
          )
          component = replace_once(
              component,
              '        <span id={`${domain}-empty`} className="sr-only">',
              '        <span id={emptyId} className="sr-only">',
              "DomainChip local description span",
          )
          component = replace_once(
              component,
              '              Drawn on the formulation sheet, which stresses the layout hardest: two groups, sixteen options and the\n              longest title in the app. The three directions share one set of craft fixes and differ only in how the\n',
              '              Drawn on the formulation sheet, which stresses the layout hardest: four domain themes, twelve domains,\n              twelve mechanisms, four presets, thirteen domain chips and the longest title in the app. The three\n              directions share one set of craft fixes and differ only in how the\n',
              "page lede specimen counts",
          )
          component = replace_once(
              component,
              'the best answer to a sheet that has to hold sixteen options without feeling like a word cloud.',
              'the best answer to a sheet that has to hold twelve domain options without feeling like a word cloud.',
              "Style B option count",
          )
          component = replace_once(
              component,
              '          {/* Sticky sub-head: with sixteen rows the group label must survive the',
              '          {/* Sticky sub-head: with twelve domain rows the group label must survive the',
              "Style C row count",
          )
          if "sixteen options" in component:
              raise SystemExit("stale 'sixteen options' wording remains in component")
          component_path.write_text(component, encoding="utf-8")

          readme = readme_path.read_text(encoding="utf-8")
          readme = replace_once(
              readme,
              'the specimen that stresses the layout hardest — two groups, sixteen options, and the longest title in the app.',
              'the specimen that stresses the layout hardest — four domain themes, twelve domains, twelve mechanisms, four presets, thirteen domain chips, and the longest title in the app.',
              "README specimen counts",
          )
          if "two groups, sixteen options" in readme:
              raise SystemExit("stale specimen-count wording remains in README")
          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Format and validate focused changes
        run: |
          npx prettier --write mockups/README.md src/components/filter-sheet-restyle-mockups.tsx
          npx eslint src/components/filter-sheet-restyle-mockups.tsx --max-warnings 0
          npx vitest run tests/filter-sheet-restyle-mockups.test.ts
          node scripts/check-branch-review-ledger.mjs

      - name: Commit fixes and remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr1846-review-fixes.yml
          git add mockups/README.md src/components/filter-sheet-restyle-mockups.tsx docs/branch-review-ledger.md
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m "fix(mockups): address PR #1846 review feedback and sync main"

          # Catch a main merge that lands while this job is validating. The push
          # stays non-force, so a concurrent branch update fails safely.
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          git push origin HEAD:claude/filter-popup-design-mockups-x6sbjv
