name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  # Phase 1: Code quality and dependency checks
  lint-and-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@1a4442caab335fa5ed526f0b2b582048926ad1efb # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck:ci

      - name: Check bundle budget
        run: npm run check:bundle-budget

      - name: Knip (dead code)
        run: npm run check:knip

  # Phase 2: Unit tests with coverage
  test-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@1a4442caab335fa5ed526f0b2b582048926ad1efb # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@68e654f1b29b76e4a7aa79f1b3f1b85d0ac5c55d # v4
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

  # Phase 3: Docker image build & push
  build-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [lint-and-typecheck, test-unit]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e13c6f9f9c52e9d16a51c5f1c3bedfc1b # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442f4ca45205fda2583c33a7303da11f87 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691021f747bc2a3292a256dc # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push app image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://sjrfecxgysukkwxsowpy.supabase.co
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'placeholder-ci-key' }}
            MAX_UPLOAD_MB=50
            NEXT_PUBLIC_MAX_UPLOAD_MB=50
            ALLOW_LOW_RAM_BUILD=1
            RAILWAY_GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=app,timeout=2m
          cache-to: type=gha,scope=app,mode=max,timeout=2m,ignore-error=true

      - name: Build and push worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker,timeout=2m
          cache-to: type=gha,scope=worker,mode=max,timeout=2m,ignore-error=true

  # Phase 4: Security scanning
  scan-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-image]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@6e7b7d1ac3b6fe66de33d1876be8856e108dcde5 # v0.24.0
        with:
          image-ref: ${{ needs.build-image.outputs.image }}@${{ needs.build-image.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@396578fcf008ab6211f8c3f8a06f49ff4f36e50f # v3
        with:
          sarif_file: trivy-results.sarif

  # Phase 5: E2E tests on built image (PRs only)
  test-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [build-image]
    if: github.event_name == 'pull_request' && needs.build-image.result == 'success'
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@1a4442caab335fa5ed526f0b2b582048926ad1efb # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run E2E tests (shard ${{ matrix.shard }})
        run: npm run test:e2e:pr -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # Phase 6: Summary gate
  verify:
    runs-on: ubuntu-24.04
    if: always()
    needs: [lint-and-typecheck, test-unit, build-image, scan-image]
    steps:
      - name: Check job status
        run: |
          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" || \
                "${{ needs.test-unit.result }}" != "success" || \
                "${{ needs.build-image.result }}" != "success" ]]; then
            echo "CI failed"
            exit 1
          fi
