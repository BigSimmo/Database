name: Finalize PR 1868 review ledger

on:
  push:
    branches:
      - codex/windows-test-portability
    paths:
      - .github/workflows/finalize-pr-1868-ledger.yml

permissions:
  contents: write

concurrency:
  group: finalize-pr-1868-ledger
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'BigSimmo/Database'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact verified head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: codex/windows-test-portability
          persist-credentials: false

      - name: Guard verified parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a4e0fbe378429d73f7118e9b801945cb483e3e86"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev --prefer-offline --no-audit --no-fund

      - name: Append and validate review record
        shell: bash
        run: |
          set -euo pipefail
          npm run ledger:append -- \
            --ref "PR #1868 / codex/windows-test-portability" \
            --head "fbb4a6baff2826d8f31b549a8de7ee90c0c52df4" \
            --scope "latest-main merge, Windows test-harness portability, CLS managed-port and readiness hardening, fail-safe cleanup, and signed-image URL isolation" \
            --outcome "Merged current main without unexpected overlap; bounded each CLS readiness request while preserving the overall deadline; guaranteed heavy-run lock release after cleanup errors; replaced the recursive-cleanup regex with per-call TypeScript AST validation; fixed all discovered Windows cleanup retries and review findings." \
            --checks "Verified in Actions: Node syntax, focused ESLint, source typecheck, 48 focused Vitest tests, documentation inventories, and branch-review-ledger validation."
          npm run check:branch-review-ledger
          git diff --check

      - name: Publish verified ledger blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base64 -w 0 docs/branch-review-ledger.md | \
            jq -Rs '{ content: ., encoding: "base64" }' > /tmp/ledger-blob.json
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            --data-binary @/tmp/ledger-blob.json)"
          sha="$(jq -r '.sha // empty' <<<"$response")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid ledger blob response: $response" >&2
            exit 1
          }
          echo "VERIFIED_LEDGER_BLOB $sha"
