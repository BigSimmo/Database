name: Build PR 1868 review fixes

on:
  push:
    branches:
      - codex/windows-test-portability
    paths:
      - .github/workflows/build-pr-1868-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: build-pr-1868-review-fixes
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'BigSimmo/Database'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: codex/windows-test-portability
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply guarded review fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "53bc4a324121df92e52273595c65cc49b6d75cbf"

          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          script_path = Path("scripts/measure-cls-attribution.mjs")
          script = script_path.read_text(encoding="utf-8")
          script = replace_once(script, 'import http from "node:http";\n', "", "remove direct HTTP import")
          script = replace_once(
              script,
              'import { offlineTestEnvironment } from "./test-environment.mjs";\n',
              'import { waitForHttpReadiness } from "./lib/http-readiness.mjs";\n'
              'import { offlineTestEnvironment } from "./test-environment.mjs";\n',
              "readiness helper import",
          )
          old_wait = '''/** Resolves once the isolated server identifies itself, or rejects if it dies first. */
          function waitForServer(url, child) {
            return new Promise((resolve, reject) => {
              const deadline = Date.now() + 120_000;
              let exited = false;
              child.on("exit", () => {
                exited = true;
              });
              const poll = () => {
                if (exited) return reject(new Error("isolated server exited before becoming ready"));
                if (Date.now() > deadline) return reject(new Error("isolated server did not become ready within 120s"));
                http
                  .get(`${url}/api/local-project-id`, (response) => {
                    let body = "";
                    response.setEncoding("utf8");
                    response.on("data", (chunk) => (body += chunk));
                    response.on("end", () => {
                      if (response.statusCode === 200 && isThisProject(body)) return resolve();
                      setTimeout(poll, 500);
                    });
                  })
                  .on("error", () => setTimeout(poll, 500));
              };
              poll();
            });
          }
          '''
          new_wait = '''/** Resolves once the isolated server identifies itself, or rejects if it dies first. */
          async function waitForServer(url, child) {
            await waitForHttpReadiness({
              url: `${url}/api/local-project-id`,
              isReady: ({ statusCode, body }) => statusCode === 200 && isThisProject(body),
              hasExited: () => child.exitCode !== null || child.signalCode !== null,
              timeoutMs: 120_000,
              requestTimeoutMs: 5_000,
              pollIntervalMs: 500,
              exitErrorMessage: "isolated server exited before becoming ready",
              timeoutErrorMessage: "isolated server did not become ready within 120s",
            });
          }
          '''
          script = replace_once(script, old_wait, new_wait, "bounded readiness polling")
          old_cleanup = '''} finally {
            try {
              await browser?.close();
            } catch {
              /* browser failed before it could close */
            }
            stopOwnedProcessTree(server);
            removePathSync(absoluteRunRoot, { recursive: true });
            lock.release();
          }
          '''
          new_cleanup = '''} finally {
            try {
              try {
                await browser?.close();
              } catch {
                /* browser failed before it could close */
              }
              try {
                stopOwnedProcessTree(server);
              } finally {
                removePathSync(absoluteRunRoot, { recursive: true });
              }
            } finally {
              lock.release();
            }
          }
          '''
          script = replace_once(script, old_cleanup, new_cleanup, "fail-safe heavy-run cleanup")
          script_path.write_text(script, encoding="utf-8")

          helper_path = Path("scripts/lib/http-readiness.mjs")
          helper_path.parent.mkdir(parents=True, exist_ok=True)
          helper_path.write_text(
              '''import http from "node:http";

          const defaultSleep = (delayMs) => new Promise((resolve) => setTimeout(resolve, delayMs));

          /** Perform one bounded GET attempt and return its completed response, or null. */
          export function requestText(url, timeoutMs, client = http) {
            if (!Number.isFinite(timeoutMs) || timeoutMs <= 0) {
              throw new TypeError(`HTTP request timeout must be positive; received ${timeoutMs}.`);
            }

            return new Promise((resolve) => {
              let settled = false;
              let timeout = null;
              let request = null;

              const finish = (result) => {
                if (settled) return;
                settled = true;
                if (timeout !== null) clearTimeout(timeout);
                resolve(result);
              };

              try {
                request = client.get(url, (response) => {
                  let body = "";
                  response.setEncoding("utf8");
                  response.on("data", (chunk) => {
                    body += chunk;
                  });
                  response.on("end", () => finish({ statusCode: response.statusCode, body }));
                  response.on("aborted", () => finish(null));
                  response.on("error", () => finish(null));
                  response.on("close", () => {
                    if (!response.complete) finish(null);
                  });
                });
              } catch {
                finish(null);
                return;
              }

              request.on("error", () => finish(null));
              request.on("close", () => finish(null));
              timeout = setTimeout(() => {
                finish(null);
                request.destroy();
              }, timeoutMs);
            });
          }

          /** Poll a bounded HTTP request until its response passes the readiness predicate. */
          export async function waitForHttpReadiness({
            url,
            isReady,
            hasExited = () => false,
            timeoutMs,
            requestTimeoutMs = 5_000,
            pollIntervalMs = 500,
            exitErrorMessage = "server exited before becoming ready",
            timeoutErrorMessage = `server did not become ready within ${timeoutMs}ms`,
            now = Date.now,
            sleep = defaultSleep,
            request = requestText,
          }) {
            if (!Number.isFinite(timeoutMs) || timeoutMs <= 0) {
              throw new TypeError(`Readiness timeout must be positive; received ${timeoutMs}.`);
            }

            const deadline = now() + timeoutMs;
            while (true) {
              if (hasExited()) throw new Error(exitErrorMessage);
              const remaining = deadline - now();
              if (remaining <= 0) throw new Error(timeoutErrorMessage);

              const result = await request(url, Math.max(1, Math.min(requestTimeoutMs, remaining)));
              if (result && isReady(result)) return;

              const delayMs = Math.min(pollIntervalMs, Math.max(0, deadline - now()));
              if (delayMs > 0) await sleep(delayMs);
            }
          }
          ''',
              encoding="utf-8",
          )

          readiness_test = Path("tests/http-readiness.test.ts")
          readiness_test.write_text(
              '''import { createServer, type Server } from "node:http";
          import type { AddressInfo } from "node:net";

          import { afterEach, describe, expect, it } from "vitest";

          import { waitForHttpReadiness } from "../scripts/lib/http-readiness.mjs";

          const servers: Server[] = [];

          afterEach(async () => {
            await Promise.all(
              servers.splice(0).map(
                (server) =>
                  new Promise<void>((resolve, reject) => {
                    server.closeAllConnections();
                    server.close((error) => (error ? reject(error) : resolve()));
                  }),
              ),
            );
          });

          async function listen(server: Server) {
            servers.push(server);
            await new Promise<void>((resolve, reject) => {
              const fail = (error: Error) => reject(error);
              server.once("error", fail);
              server.listen(0, "127.0.0.1", () => {
                server.off("error", fail);
                resolve();
              });
            });
            const address = server.address() as AddressInfo;
            return `http://127.0.0.1:${address.port}`;
          }

          describe("bounded HTTP readiness", () => {
            it("destroys stalled requests and resumes polling", async () => {
              let requests = 0;
              const url = await listen(
                createServer((_request, response) => {
                  requests += 1;
                  if (requests < 3) {
                    response.writeHead(200, { "content-type": "text/plain" });
                    response.write("partial");
                    return;
                  }
                  response.end("ready");
                }),
              );

              await expect(
                waitForHttpReadiness({
                  url,
                  isReady: ({ statusCode, body }) => statusCode === 200 && body === "ready",
                  timeoutMs: 1_000,
                  requestTimeoutMs: 40,
                  pollIntervalMs: 5,
                }),
              ).resolves.toBeUndefined();
              expect(requests).toBe(3);
            });

            it("honours the overall deadline when every response remains open", async () => {
              let requests = 0;
              const url = await listen(
                createServer((_request, response) => {
                  requests += 1;
                  response.writeHead(200, { "content-type": "text/plain" });
                  response.write("partial");
                }),
              );
              const startedAt = Date.now();

              await expect(
                waitForHttpReadiness({
                  url,
                  isReady: () => false,
                  timeoutMs: 180,
                  requestTimeoutMs: 40,
                  pollIntervalMs: 5,
                  timeoutErrorMessage: "readiness deadline elapsed",
                }),
              ).rejects.toThrow("readiness deadline elapsed");
              expect(requests).toBeGreaterThan(1);
              expect(Date.now() - startedAt).toBeLessThan(2_000);
            });
          });
          ''',
              encoding="utf-8",
          )

          contract_path = Path("tests/measure-cls-attribution-contract.test.ts")
          contract = contract_path.read_text(encoding="utf-8")
          marker = '''  it("uses the shared browser-runner safety boundaries", () => {
          '''
          contract_test = '''  it("bounds readiness requests and releases the heavy-run lock after cleanup failures", () => {
            expect(source).toContain('import { waitForHttpReadiness } from "./lib/http-readiness.mjs";');
            expect(source).toContain("requestTimeoutMs: 5_000");
            expect(source).toContain("timeoutMs: 120_000");
            const cleanup = source.slice(source.indexOf("const lock = acquireHeavyRunLock"));
            expect(cleanup).toContain(
              "try {\\n      stopOwnedProcessTree(server);\\n    } finally {\\n      removePathSync(absoluteRunRoot, { recursive: true });\\n    }",
            );
            expect(cleanup).toContain("  } finally {\\n    lock.release();\\n  }");
          });

          '''
          contract = replace_once(contract, marker, contract_test + marker, "CLS cleanup contract")
          contract_path.write_text(contract, encoding="utf-8")

          safety_path = Path("tests/test-runner-safety.test.ts")
          safety = safety_path.read_text(encoding="utf-8")
          safety = replace_once(
              safety,
              'import { fileURLToPath } from "node:url";\nimport { afterEach, describe, expect, it } from "vitest";\n',
              'import { fileURLToPath } from "node:url";\nimport ts from "typescript";\nimport { afterEach, describe, expect, it } from "vitest";\n',
              "TypeScript parser import",
          )
          source_helper_marker = '''function requireLeasePath(lease: { path?: string }) {
          '''
          source_helpers = '''function propertyAssignment(
            objectLiteral: ts.ObjectLiteralExpression,
            name: string,
          ): ts.PropertyAssignment | undefined {
            return objectLiteral.properties.find(
              (property): property is ts.PropertyAssignment =>
                ts.isPropertyAssignment(property) &&
                (ts.isIdentifier(property.name) || ts.isStringLiteral(property.name)) &&
                property.name.text === name,
            );
          }

          function unsafeRecursiveRmSyncCalls(sourceText: string, filePath: string): string[] {
            const scriptKind = filePath.endsWith(".tsx")
              ? ts.ScriptKind.TSX
              : filePath.endsWith(".jsx")
                ? ts.ScriptKind.JSX
                : filePath.endsWith(".js")
                  ? ts.ScriptKind.JS
                  : ts.ScriptKind.TS;
            const sourceFile = ts.createSourceFile(filePath, sourceText, ts.ScriptTarget.Latest, true, scriptKind);
            const unsafe: string[] = [];

            const visit = (node: ts.Node) => {
              if (ts.isCallExpression(node) && ts.isIdentifier(node.expression) && node.expression.text === "rmSync") {
                const options = node.arguments[1];
                if (options && ts.isObjectLiteralExpression(options)) {
                  const recursive = propertyAssignment(options, "recursive");
                  if (recursive?.initializer.kind === ts.SyntaxKind.TrueKeyword) {
                    const retries = propertyAssignment(options, "maxRetries");
                    const retryCount =
                      retries && ts.isNumericLiteral(retries.initializer)
                        ? Number(retries.initializer.text)
                        : Number.NaN;
                    if (!Number.isFinite(retryCount) || retryCount <= 0) unsafe.push(node.getText(sourceFile));
                  }
                }
              }
              ts.forEachChild(node, visit);
            };

            visit(sourceFile);
            return unsafe;
          }

          '''
          safety = replace_once(
              safety,
              source_helper_marker,
              source_helpers + source_helper_marker,
              "AST cleanup guard helpers",
          )
          old_guard_test = '''  it("requires bounded retries for every recursive test-fixture cleanup", () => {
            const testsRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)));
            const unsafeRecursiveRemoval = /rmSync\\([\\s\\S]{0,140}?recursive:\\s*true(?![\\s\\S]{0,100}?maxRetries)/;
            for (const filePath of sourceFiles(testsRoot)) {
              expect(readFileSync(filePath, "utf8"), filePath).not.toMatch(unsafeRecursiveRemoval);
            }
          });
          '''
          new_guard_test = '''  it("scopes retry validation to each rmSync options object regardless of option order", () => {
            const sourceText = `
              rmSync("unsafe", { recursive: true }); // maxRetries: 5
              "maxRetries: 5";
              rmSync("safe", { maxRetries: 5, recursive: true });
              rmSync("also-safe", { recursive: true, maxRetries: 5 });
            `;
            expect(unsafeRecursiveRmSyncCalls(sourceText, "fixture.ts")).toEqual([
              'rmSync("unsafe", { recursive: true })',
            ]);
          });

          it("requires bounded retries for every recursive test-fixture cleanup", () => {
            const testsRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)));
            for (const filePath of sourceFiles(testsRoot)) {
              const unsafe = unsafeRecursiveRmSyncCalls(readFileSync(filePath, "utf8"), filePath);
              expect(unsafe, `${filePath}\\n${unsafe.join("\\n")}`).toEqual([]);
            }
          });
          '''
          safety = replace_once(safety, old_guard_test, new_guard_test, "per-call recursive cleanup guard")
          safety_path.write_text(safety, encoding="utf-8")

          docs_path = Path("docs/scripts-index.md")
          docs = docs_path.read_text(encoding="utf-8")
          docs = replace_once(docs, "Curated map of `scripts/` (228 files)", "Curated map of `scripts/` (229 files)", "script count")
          docs_path.write_text(docs, encoding="utf-8")
          PY

      - name: Install locked dependencies
        run: npm ci --include=dev --prefer-offline --no-audit --no-fund

      - name: Format changed files
        run: >-
          npx prettier --write
          scripts/measure-cls-attribution.mjs
          scripts/lib/http-readiness.mjs
          tests/http-readiness.test.ts
          tests/measure-cls-attribution-contract.test.ts
          tests/test-runner-safety.test.ts
          docs/scripts-index.md

      - name: Verify focused fixes
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/measure-cls-attribution.mjs
          node --check scripts/lib/http-readiness.mjs
          npx eslint \
            scripts/measure-cls-attribution.mjs \
            scripts/lib/http-readiness.mjs \
            tests/http-readiness.test.ts \
            tests/measure-cls-attribution-contract.test.ts \
            tests/test-runner-safety.test.ts
          npx vitest run \
            tests/http-readiness.test.ts \
            tests/measure-cls-attribution-contract.test.ts \
            tests/test-runner-safety.test.ts
          npm run docs:check-index
          npm run docs:check-inventory
          npm run docs:check-scripts
          git diff --check

      - name: Publish verified content blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          create_blob() {
            local file="$1"
            local payload response sha
            payload="$(base64 -w 0 "$file" | jq -Rs '{ content: ., encoding: "base64" }')"
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
              --data "$payload")"
            sha="$(jq -r '.sha // empty' <<<"$response")"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Invalid blob response for $file: $response" >&2
              exit 1
            }
            echo "VERIFIED_BLOB $file $sha"
          }

          create_blob scripts/measure-cls-attribution.mjs
          create_blob scripts/lib/http-readiness.mjs
          create_blob tests/http-readiness.test.ts
          create_blob tests/measure-cls-attribution-contract.test.ts
          create_blob tests/test-runner-safety.test.ts
          create_blob docs/scripts-index.md
