name: Codex review thread resolution

on:
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  resolve-codex-thread:
    name: Resolve Codex review thread
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # This workflow never requests a repair. A human must invoke Codex, and this
    # bridge only closes the exact thread named by a trusted Codex disposition.
    if: >
      github.event_name == 'pull_request_review_comment' &&
      github.event.pull_request.state == 'open' &&
      github.event.comment.user.type == 'Bot' &&
      (github.event.comment.user.login == 'chatgpt-codex-connector' ||
      github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      # GitHub keeps only one pending run per group. Key by the parent review
      # comment so dispositions for distinct threads cannot evict one another.
      group: codex-thread-resolution-${{ github.event.pull_request.number }}-${{ github.event.comment.in_reply_to_id || github.event.comment.id }}
      cancel-in-progress: false
    steps:
      - name: Resolve Codex review thread on disposition marker
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const pr = context.payload.pull_request;
            const reviewComment = context.payload.comment;
            const allowedCodexBotLogins = new Set([
              "chatgpt-codex-connector",
              "chatgpt-codex-connector[bot]",
            ]);
            const resolvedDispositionMarker = "<!-- codex-thread-disposition:resolved -->";
            const fixedHeadPattern = /^<!-- codex-thread-result:fixed-head:([0-9a-f]{40}) -->$/;
            const noChangeMarker = "<!-- codex-thread-result:no-change -->";

            if (
              reviewComment.user?.type !== "Bot" ||
              !allowedCodexBotLogins.has(reviewComment.user.login)
            ) {
              core.warning("Skipping Codex thread resolution because the review comment author is not the trusted Codex connector bot.");
              return;
            }

            if (!reviewComment.in_reply_to_id) {
              core.notice("Skipping non-reply Codex review comment; repair invocation is human-authored.");
              return;
            }

            const replyLines = (reviewComment.body || "").split(/\r?\n/);
            const dispositionLine = replyLines[0] || "";
            const resultLine = replyLines[1] || "";
            if (dispositionLine !== resolvedDispositionMarker) {
              core.notice("Skipping review-thread reply without the exact trusted resolved disposition marker.");
              return;
            }

            const fixedHeadMatch = resultLine.match(fixedHeadPattern);
            const isNoChangeDisposition = resultLine === noChangeMarker;
            const declaredResultLines = replyLines.filter((line) => line.startsWith("<!-- codex-thread-result:"));
            if (
              Boolean(fixedHeadMatch) === isNoChangeDisposition ||
              declaredResultLines.length !== 1 ||
              declaredResultLines[0] !== resultLine
            ) {
              core.setFailed("Codex disposition must declare exactly one result on the second line: a verified fixed head or no code change.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = pr.number;
            const targetCommentIds = [reviewComment.id, reviewComment.in_reply_to_id];
            const reviewThreadsQuery = `
              query ReviewThreads($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    headRefOid
                    state
                    reviewThreads(first: 100, after: $cursor) {
                      nodes {
                        id
                        isResolved
                        comments(first: 100) {
                          nodes { databaseId }
                          pageInfo { endCursor hasNextPage }
                        }
                      }
                      pageInfo {
                        endCursor
                        hasNextPage
                      }
                    }
                  }
                }
              }
            `;
            const threadCommentsQuery = `
              query ThreadComments($threadId: ID!, $commentsCursor: String) {
                node(id: $threadId) {
                  ... on PullRequestReviewThread {
                    id
                    isResolved
                    comments(first: 100, after: $commentsCursor) {
                      nodes { databaseId }
                      pageInfo { endCursor hasNextPage }
                    }
                  }
                }
              }
            `;
            const resolutionPreflightQuery = `
              query ResolutionPreflight($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) { headRefOid state }
                }
              }
            `;
            const resolutionPostflightQuery = `
              query ResolutionPostflight($owner: String!, $repo: String!, $number: Int!, $threadId: ID!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) { headRefOid state }
                }
                node(id: $threadId) {
                  ... on PullRequestReviewThread { id isResolved }
                }
              }
            `;
            const resolveReviewThreadMutation = `
              mutation ResolveReviewThread($threadId: ID!) {
                resolveReviewThread(input: { threadId: $threadId }) {
                  thread { id isResolved }
                }
              }
            `;
            const unresolveReviewThreadMutation = `
              mutation UnresolveReviewThread($threadId: ID!) {
                unresolveReviewThread(input: { threadId: $threadId }) {
                  thread { id isResolved }
                }
              }
            `;
            const compensateResolutionFailure = async (threadId, reason) => {
              let compensationOutcome;
              try {
                const compensation = await github.graphql(unresolveReviewThreadMutation, { threadId });
                compensationOutcome = compensation.unresolveReviewThread?.thread?.isResolved === false
                  ? "The thread resolution was reverted."
                  : "GitHub did not confirm that the thread resolution was reverted.";
              } catch (compensationError) {
                const compensationDetail = compensationError instanceof Error
                  ? compensationError.message
                  : String(compensationError);
                compensationOutcome = `Compensation also failed: ${compensationDetail}.`;
              }
              const message = `${reason} ${compensationOutcome}`;
              core.warning(message);
              core.setFailed(message);
            };

            let cursor = null;
            let liveHeadRefOid;
            let liveState;
            let matchingThread;
            let resolutionAttempted = false;

            try {
              do {
                const result = await github.graphql(reviewThreadsQuery, {
                  owner,
                  repo,
                  number: issue_number,
                  cursor,
                });
                const livePullRequest = result.repository?.pullRequest;
                liveHeadRefOid = livePullRequest?.headRefOid;
                liveState = livePullRequest?.state;
                const connection = livePullRequest?.reviewThreads;
                for (const thread of connection?.nodes ?? []) {
                  const threadCommentIds = new Set(
                    thread.comments.nodes.map((comment) => comment.databaseId),
                  );
                  const isCandidate = targetCommentIds.some((commentId) => threadCommentIds.has(commentId));
                  let commentsCursor = thread.comments.pageInfo?.hasNextPage
                    ? thread.comments.pageInfo.endCursor
                    : null;
                  while (
                    isCandidate &&
                    !targetCommentIds.every((commentId) => threadCommentIds.has(commentId)) &&
                    commentsCursor
                  ) {
                    const commentsResult = await github.graphql(threadCommentsQuery, {
                      threadId: thread.id,
                      commentsCursor,
                    });
                    const currentThread = commentsResult.node;
                    if (!currentThread || currentThread.id !== thread.id) break;
                    for (const comment of currentThread.comments.nodes) {
                      threadCommentIds.add(comment.databaseId);
                    }
                    commentsCursor = currentThread.comments.pageInfo?.hasNextPage
                      ? currentThread.comments.pageInfo.endCursor
                      : null;
                  }
                  if (targetCommentIds.every((commentId) => threadCommentIds.has(commentId))) {
                    matchingThread = thread;
                    break;
                  }
                }
                cursor = connection?.pageInfo?.hasNextPage ? connection.pageInfo.endCursor : null;
              } while (!matchingThread && cursor);

              if (!matchingThread) {
                core.setFailed("Codex thread resolution could not validate the disposition reply relationship.");
                return;
              }

              if (matchingThread.isResolved) {
                core.notice("The Codex review thread was already resolved.");
                return;
              }

              if (liveState !== "OPEN") {
                core.setFailed("The pull request is no longer open; leaving the review thread unresolved.");
                return;
              }

              if (fixedHeadMatch && liveHeadRefOid !== fixedHeadMatch[1]) {
                core.setFailed(
                  `Codex reported fixed commit ${fixedHeadMatch[1]}, but the live pull request head is ${liveHeadRefOid || "unavailable"}; leaving the thread open.`,
                );
                return;
              }

              const preflight = await github.graphql(resolutionPreflightQuery, {
                owner,
                repo,
                number: issue_number,
              });
              const preflightPullRequest = preflight.repository?.pullRequest;
              if (preflightPullRequest?.state !== "OPEN") {
                core.setFailed("The pull request is no longer open immediately before resolution; leaving the thread open.");
                return;
              }
              if (preflightPullRequest.headRefOid !== liveHeadRefOid) {
                core.setFailed("The pull request head changed immediately before resolution; leaving the thread open.");
                return;
              }
              if (fixedHeadMatch && preflightPullRequest.headRefOid !== fixedHeadMatch[1]) {
                core.setFailed("The verified fixed head changed immediately before resolution; leaving the thread open.");
                return;
              }

              resolutionAttempted = true;
              const resolution = await github.graphql(resolveReviewThreadMutation, {
                threadId: matchingThread.id,
              });
              if (resolution.resolveReviewThread?.thread?.isResolved !== true) {
                await compensateResolutionFailure(
                  matchingThread.id,
                  "GitHub did not confirm that the Codex review thread was resolved.",
                );
                return;
              }

              const postflight = await github.graphql(resolutionPostflightQuery, {
                owner,
                repo,
                number: issue_number,
                threadId: matchingThread.id,
              });
              const postflightPullRequest = postflight.repository?.pullRequest;
              const stateOrHeadDrifted =
                postflightPullRequest?.state !== "OPEN" ||
                postflightPullRequest?.headRefOid !== preflightPullRequest.headRefOid;
              if (stateOrHeadDrifted) {
                await compensateResolutionFailure(
                  matchingThread.id,
                  "The pull request state or head changed during resolution.",
                );
                return;
              }
              if (postflight.node?.id !== matchingThread.id || postflight.node?.isResolved !== true) {
                await compensateResolutionFailure(
                  matchingThread.id,
                  "Post-resolution validation did not confirm that the review thread remained resolved.",
                );
                return;
              }
              core.notice("Resolved the Codex review thread after its explicit disposition reply.");
            } catch (error) {
              const failureReason = `Codex thread resolution failed while closing the review thread: ${error.message || error}.`;
              if (resolutionAttempted && matchingThread) {
                await compensateResolutionFailure(matchingThread.id, failureReason);
                return;
              }
              core.warning(failureReason);
              core.setFailed(failureReason);
            }
