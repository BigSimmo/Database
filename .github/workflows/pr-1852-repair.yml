name: PR 1852 merge repair

on:
  push:
    branches:
      - codex/cloud-parity-repair-20260812

permissions:
  contents: write

concurrency:
  group: pr-1852-merge-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/cloud-parity-repair-20260812
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and preserve Cloud parity hardening
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'Current main is already present in the PR branch.'
          else
            set +e
            git merge --no-commit --no-ff origin/main
            merge_status=$?
            set -e

            if [ "$merge_status" -ne 0 ]; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              unexpected="$(printf '%s\n' "$conflicts" | grep -v '^docs/branch-review-ledger.md$' || true)"
              if [ -n "$unexpected" ]; then
                printf 'Unexpected merge conflicts:\n%s\n' "$unexpected" >&2
                exit 1
              fi
              if printf '%s\n' "$conflicts" | grep -qx 'docs/branch-review-ledger.md'; then
                git checkout --theirs -- docs/branch-review-ledger.md
                git add docs/branch-review-ledger.md
              fi
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo 'Unresolved merge conflicts remain.' >&2
                exit 1
              fi
            fi

            if [ ! -f .git/MERGE_HEAD ]; then
              echo 'Main is not an ancestor and no merge state was created.' >&2
              exit 1
            fi
          fi

          python3 <<'PY'
          from pathlib import Path

          setup = Path('scripts/setup-codex-cloud.sh').read_text()
          required_setup_markers = (
              'require_npm_config() {',
              'require_npm_config force false',
              'require_npm_config legacy-peer-deps false',
              'require_npm_config ignore-scripts false',
              'require_npm_config package-lock true',
              'require_npm_config offline false',
              'require_npm_config dry-run false',
              'npm ci --include=dev --prefer-offline --no-audit --no-fund',
          )
          missing = [marker for marker in required_setup_markers if marker not in setup]
          if missing:
              raise SystemExit(f'Missing Cloud setup hardening markers: {missing}')

          checker = Path('scripts/check-codex-cloud-setup.mjs').read_text()
          required_checker_markers = (
              'export function validateCloudNpmInstallContract(setupText) {',
              'errors.push(...validateCloudNpmInstallContract(setup));',
              'Cloud project dependency install must be a direct, unchained command without expansion.',
          )
          missing = [marker for marker in required_checker_markers if marker not in checker]
          if missing:
              raise SystemExit(f'Missing Cloud npm contract validator markers: {missing}')

          tests = Path('tests/codex-cloud-setup.test.ts').read_text()
          required_test_markers = (
              'validateCloudNpmInstallContract,',
              'keeps the Cloud npm install locked, cache-friendly, and lifecycle-capable',
              'validates the Cloud npm install contract: %s',
              '"chained command"',
          )
          missing = [marker for marker in required_test_markers if marker not in tests]
          if missing:
              raise SystemExit(f'Missing Cloud npm contract test markers: {missing}')

          guide = Path('docs/codex-cloud.md').read_text()
          required_guide_markers = (
              '| Repository-owned setup',
              '| Host/platform capability',
              '| Intentional security boundary',
              '| Optional or external acceptance',
              'Never repair a host capability gap by copying credentials,',
          )
          missing = [marker for marker in required_guide_markers if marker not in guide]
          if missing:
              raise SystemExit(f'Missing Cloud boundary documentation markers: {missing}')

          ledger_path = Path('docs/branch-review-ledger.md')
          ledger = ledger_path.read_text()
          marker = '| 2026-08-12 | codex/cloud-parity-repair-20260812 |'
          if marker not in ledger:
              if not ledger.endswith('\n'):
                  ledger += '\n'
              ledger += (
                  '| 2026-08-12 | codex/cloud-parity-repair-20260812 | '
                  '1564f617e8463e223d4a797de9eaeaba8f0827ec | '
                  'Codex Cloud setup and local parity repair | Fixed npm-config fail-closed guards, '
                  'centralized the install contract, and corrected Cloud/local boundaries; Windows broad-gate '
                  'failures reproduced at base | 33 focused tests; check:codex-cloud; docs checks; PR-local '
                  'through typecheck, then 16 baseline unit failures; RAG fixtures; format; diff check |\n'
              )
              ledger_path.write_text(ledger)
          PY

          git add docs/branch-review-ledger.md
          git diff --check

          if [ -f .git/MERGE_HEAD ]; then
            git commit -m 'Merge main into PR 1852 and preserve Cloud parity hardening'
            git push origin HEAD:codex/cloud-parity-repair-20260812
          else
            echo 'No merge commit required.'
          fi
