# Daily ops digest. Renders the live deep health probe (SLO counters, cache
# hit-rate, answer spend, degraded/truncation rates) into a one-screen summary
# and keeps it in a rolling GitHub issue, commenting only when something is off.
#
# The repo variable and matching deployment/GitHub secret must both be
# provisioned. The preflight below fails closed when either name is absent.
# Keep workflow_dispatch for operator verification and the daily schedule for
# the normal morning digest.
name: Ops Digest

on:
  workflow_dispatch: {}
  schedule:
    # 20:00 UTC = 06:00 Australia/Sydney — a morning digest.
    - cron: "0 20 * * *"

concurrency:
  group: ops-digest
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # GitHub cron fires are best-effort, and the canary's own failure issue only
  # reacts to runs that happen and fail. Check liveness once with the daily ops
  # cadence instead of making the Actions API call on every pull request.
  eval-canary-liveness:
    name: Eval-canary liveness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Warn if the weekly canary is stale
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "eval-canary.yml",
                status: "completed",
                per_page: 1,
              });
              const latest = data.workflow_runs?.[0];
              // updated_at approximates completion time; run_started_at is the
              // fallback for older or partial REST payloads.
              const finishedAt = Date.parse(latest?.updated_at ?? latest?.run_started_at ?? "");
              if (!latest) {
                core.warning("Eval-canary liveness: no completed canary runs found.");
              } else if (!Number.isFinite(finishedAt)) {
                core.info("Eval-canary liveness: latest completed run has no parseable timestamp; skipping staleness check.");
              } else {
                const ageDays = (Date.now() - finishedAt) / 86_400_000;
                if (ageDays > 8) {
                  core.warning(
                    `Eval-canary liveness: last completed canary run was ${ageDays.toFixed(1)} days ago (${latest.html_url}). ` +
                      "The weekly Sunday 18:00 UTC schedule may have been dropped by GitHub - dispatch one manually " +
                      "(provider-backed; needs explicit approval).",
                  );
                } else {
                  core.info(`Eval-canary liveness: last completed run ${ageDays.toFixed(1)} days ago.`);
                }
              }
            } catch (error) {
              core.warning(`Eval-canary liveness check skipped: ${error.message}`);
            }

  ops-digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROD_HEALTH_URL: ${{ vars.PROD_HEALTH_URL }}
      HEALTH_DEEP_PROBE_SECRET: ${{ secrets.HEALTH_DEEP_PROBE_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight config
        run: |
          missing=""
          [ -z "$PROD_HEALTH_URL" ] && missing="$missing PROD_HEALTH_URL(var)"
          [ -z "$HEALTH_DEEP_PROBE_SECRET" ] && missing="$missing HEALTH_DEEP_PROBE_SECRET(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Ops digest cannot run — missing:$missing"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Render digest
        id: digest
        run: node scripts/ops-digest.mjs --out digest.md

      - name: Publish to rolling issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const label = "ops-digest";
            const body = fs.readFileSync("digest.md", "utf8");
            const status = "${{ steps.digest.outputs.status }}" || "unknown";
            const alerting = "${{ steps.digest.outputs.alerting }}" === "true";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            let issueNumber;
            if (existing.length > 0) {
              issueNumber = existing[0].number;
              // Keep the issue body as the latest snapshot.
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Ops digest",
                labels: [label],
                body,
              });
              issueNumber = created.data.number;
            }
            // Comment (and therefore notify) only when something needs attention.
            if (status !== "ok" || alerting) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `⚠ Attention (status=${status}, alerting=${alerting}) — ${new Date().toISOString()}\n\n${body}`,
              });
            }
            if (status !== "ok") core.warning(`Ops digest status: ${status}`);
