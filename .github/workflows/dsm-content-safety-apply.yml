name: DSM content safety apply

on:
  push:
    branches:
      - codex/dsm5tr-content-governance-20260901

concurrency:
  group: dsm-content-safety-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[dsm-safety-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Decode branch-local patch helper
        shell: bash
        run: |
          cat > /tmp/apply-dsm-content-safety.mjs.gz.b64 <<'PATCH'
          
          PATCH
          base64 --decode /tmp/apply-dsm-content-safety.mjs.gz.b64 | gzip --decompress > /tmp/apply-dsm-content-safety.mjs
          node --check /tmp/apply-dsm-content-safety.mjs

      - name: Add safety regression tests
        run: node /tmp/apply-dsm-content-safety.mjs --tests-only

      - name: Prove the new tests fail before implementation
        shell: bash
        run: |
          set +e
          node scripts/run-vitest.mjs run --reporter=dot \
            tests/dsm.test.ts \
            tests/dsm-content-governance.test.ts \
            tests/clinical-ask-catalogue-evidence.test.ts \
            tests/clinical-ask-authority-registry.test.ts \
            tests/clinical-ask-mode-profiles.test.ts \
            tests/dsm-content-safety.dom.test.tsx \
            tests/in-page-nav-route-sections.dom.test.tsx \
            > /tmp/dsm-red.log 2>&1
          status=$?
          set -e
          cat /tmp/dsm-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected the new DSM safety tests to fail before implementation."
            exit 1
          fi

      - name: Apply implementation and governance manifests
        run: node /tmp/apply-dsm-content-safety.mjs --implementation

      - name: Run focused DSM safety tests
        run: |
          node scripts/run-vitest.mjs run --reporter=dot \
            tests/dsm.test.ts \
            tests/dsm-content-governance.test.ts \
            tests/clinical-ask-catalogue-evidence.test.ts \
            tests/clinical-ask-authority-registry.test.ts \
            tests/clinical-ask-mode-profiles.test.ts \
            tests/dsm-content-safety.dom.test.tsx \
            tests/in-page-nav-route-sections.dom.test.tsx

      - name: Typecheck source
        run: npm run typecheck:source:internal

      - name: Validate generated site map
        run: npm run sitemap:check

      - name: Lint changed source and tests
        run: |
          node --max-old-space-size=8192 ./node_modules/eslint/bin/eslint.js \
            src/lib/dsm.ts \
            src/lib/clinical-ask/catalogue-evidence.ts \
            src/lib/clinical-ask/authority-registry.ts \
            src/lib/clinical-ask/mode-profiles.ts \
            src/components/dsm/dsm-diagnosis-page.tsx \
            src/components/dsm/dsm-comparison-page.tsx \
            src/components/dsm/dsm-search-page.tsx \
            src/components/dsm/dsm-page-header.tsx \
            'src/app/(search-app)/dsm/page.tsx' \
            'src/app/(search-app)/dsm/diagnoses/[slug]/page.tsx' \
            'src/app/(search-app)/dsm/diagnoses/[slug]/differentials/page.tsx' \
            src/lib/app-modes.ts \
            src/lib/ui-copy.ts \
            scripts/generate-site-map.ts \
            tests/dsm.test.ts \
            tests/dsm-content-governance.test.ts \
            tests/dsm-content-safety.dom.test.tsx \
            tests/clinical-ask-catalogue-evidence.test.ts \
            tests/clinical-ask-authority-registry.test.ts \
            tests/clinical-ask-mode-profiles.test.ts \
            --max-warnings 0 --no-error-on-unmatched-pattern

      - name: Commit verified changes
        shell: bash
        run: |
          git rm .github/workflows/dsm-content-safety-apply.yml
          git add \
            src/lib/dsm.ts \
            src/lib/clinical-ask/catalogue-evidence.ts \
            src/lib/clinical-ask/authority-registry.ts \
            src/lib/clinical-ask/mode-profiles.ts \
            src/components/dsm/dsm-diagnosis-page.tsx \
            src/components/dsm/dsm-comparison-page.tsx \
            src/components/dsm/dsm-search-page.tsx \
            src/components/dsm/dsm-page-header.tsx \
            'src/app/(search-app)/dsm/page.tsx' \
            'src/app/(search-app)/dsm/diagnoses/[slug]/page.tsx' \
            'src/app/(search-app)/dsm/diagnoses/[slug]/differentials/page.tsx' \
            src/lib/app-modes.ts \
            src/lib/ui-copy.ts \
            src/data/dsm-content-governance.json \
            src/data/dsm-source-register.json \
            docs/dsm-content-governance.md \
            docs/site-map.md \
            scripts/generate-site-map.ts \
            tests/dsm.test.ts \
            tests/dsm-content-governance.test.ts \
            tests/dsm-content-safety.dom.test.tsx \
            tests/clinical-ask-catalogue-evidence.test.ts \
            tests/clinical-ask-authority-registry.test.ts \
            tests/clinical-ask-mode-profiles.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(dsm): enforce content authority boundaries [dsm-safety-applied]"
          git push origin HEAD:codex/dsm5tr-content-governance-20260901
