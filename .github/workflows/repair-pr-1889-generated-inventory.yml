name: Repair PR 1889 generated inventory

on:
  push:
    branches:
      - claude/filter-therapy-compass

concurrency:
  group: repair-pr-1889-generated-inventory
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    name: Regenerate and push the reviewed repair
    if: >-
      github.event.head_commit.message == 'chore(pr-1889): run generated inventory repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact repair trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/filter-therapy-compass
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Merge latest base and regenerate source-derived files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%s HEAD)" = "chore(pr-1889): run generated inventory repair"

          git config user.name "BigSimmo"
          git config user.email "87357024+BigSimmo@users.noreply.github.com"

          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "2ae5a0aa5d339a7dc9089db134c2d9d0220444ae"

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            unmerged="$(git diff --name-only --diff-filter=U)"
            if [ "$unmerged" != "docs/filter-contract.md" ]; then
              echo "::error::Unexpected merge conflicts:"
              printf '%s\n' "$unmerged"
              exit 1
            fi
            git checkout --theirs -- docs/filter-contract.md
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path("docs/filter-contract.md")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  """- **`onClearAll` never touches the query.** Therapy-compass's clear wipes the search box; the
            shared sheet's does not. Clearing filters and clearing a search are different intentions.
          """,
                  """- **`onClearAll` never touches the query.** Clearing filters and clearing a search are different
            intentions. Therapy-compass now uses the shared sheet's filter-only clear; the composer's
            explicit \"Clear search\" action remains responsible for deleting the query.
          """,
              ),
              (
                  """- **One trigger component.** `ResultFilterTrigger`. Therapy-compass re-implements it with a
            different icon, a hardcoded test id and a different label-hiding breakpoint.
          """,
                  """- **One trigger component.** `ResultFilterTrigger`. Therapy-compass now uses the shared trigger
            at the phone breakpoint and the shared facet chips on desktop.
          """,
              ),
              (
                  """4. **Documents last** — port its needle and collapse up into the shared component as the
          """,
                  """4. **Therapy-compass** — converge runtime use of the bespoke phone-only filter sheet and trigger
             onto `ResultFilterSheet`, `ResultFilterTrigger`, and `ResultFilterFacetChips`. Topics are OR
             within their group. Review status and handout availability are independent one-option groups
             that AND with Topics and with each other. Option counts and filtering share
             `matchesTopics`/`matchesAvailability`, and Clear filters preserves the query.
          5. **Documents last** — port its needle and collapse up into the shared component as the
          """,
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one filter-contract replacement, found {count}: {old[:80]!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

          git add docs/filter-contract.md
          test -z "$(git diff --name-only --diff-filter=U)"

          # Shared services/base files must remain byte-identical to the pinned main.
          while IFS= read -r path; do
            git diff --quiet origin/main -- "$path" || {
              echo "::error::Base-owned path changed during merge: $path"
              exit 1
            }
          done <<'EOF'
          docs/branch-review-records/33f8fcf0543655449bf077fbb7595b849f39599f7d54238755ee9a649967f25a.record.md
          docs/branch-review-records/770c855f8ddb79707f4ddb49b266ea1f4d27795aa33fcc02f099586e423c15b2.record.md
          src/components/clinical-dashboard/result-filter-control.tsx
          src/components/services/services-navigator-page.tsx
          src/lib/registry-fixtures.ts
          src/lib/registry-seed.ts
          src/lib/service-catalog-mapper.ts
          src/lib/service-facets.ts
          tests/search-results-header-band.dom.test.tsx
          tests/service-facets.test.ts
          tests/services-navigator-scope-empty-state.dom.test.tsx
          tests/ui-tools.spec.ts
          EOF

          # The base merge must not rewrite the already-reviewed therapy implementation or proofs.
          while IFS= read -r path; do
            git diff --quiet "$GITHUB_SHA" -- "$path" || {
              echo "::error::Reviewed therapy path changed during base merge: $path"
              exit 1
            }
          done <<'EOF'
          src/components/therapy-compass/bindings.tsx
          src/components/therapy-compass/data/select.ts
          src/components/therapy-compass/screens/search-screen.tsx
          tests/therapy-compass-mode-wiring.test.ts
          tests/therapy-compass-search-filters.dom.test.tsx
          tests/therapy-search-facets.test.ts
          tests/ui-accessibility.spec.ts
          EOF

          git rm -- src/components/therapy-compass/filter-sheet.tsx tests/therapy-filter-sheet.dom.test.tsx

          npm ci
          npm run design-system:adoption:update
          npm run check:design-system-contract
          npm run typecheck
          npm run test -- tests/therapy-search-facets.test.ts tests/therapy-compass-search-filters.dom.test.tsx tests/therapy-compass-mode-wiring.test.ts

          test ! -e src/components/therapy-compass/filter-sheet.tsx
          test ! -e tests/therapy-filter-sheet.dom.test.tsx
          if git grep -n -E 'therapy-compass/filter-sheet|\.\./filter-sheet' -- src tests; then
            echo "::error::A runtime or test import still references the deleted legacy therapy filter module."
            exit 1
          fi

          git rm -- .github/workflows/repair-pr-1889-generated-inventory.yml

          git status --porcelain=v1 | cut -c4- | sort -u > /tmp/changed-paths
          cat > /tmp/allowed-paths <<'EOF'
          .github/workflows/repair-pr-1889-generated-inventory.yml
          docs/branch-review-records/33f8fcf0543655449bf077fbb7595b849f39599f7d54238755ee9a649967f25a.record.md
          docs/branch-review-records/770c855f8ddb79707f4ddb49b266ea1f4d27795aa33fcc02f099586e423c15b2.record.md
          docs/design-system/ADOPTION.md
          docs/design-system/COMPONENTS.md
          docs/design-system/adoption-manifest.json
          docs/filter-contract.md
          src/components/clinical-dashboard/result-filter-control.tsx
          src/components/services/services-navigator-page.tsx
          src/components/therapy-compass/filter-sheet.tsx
          src/lib/registry-fixtures.ts
          src/lib/registry-seed.ts
          src/lib/service-catalog-mapper.ts
          src/lib/service-facets.ts
          tests/search-results-header-band.dom.test.tsx
          tests/service-facets.test.ts
          tests/services-navigator-scope-empty-state.dom.test.tsx
          tests/therapy-filter-sheet.dom.test.tsx
          tests/ui-tools.spec.ts
          EOF
          sort -u -o /tmp/allowed-paths /tmp/allowed-paths
          unexpected="$(comm -23 /tmp/changed-paths /tmp/allowed-paths)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected generated-repair paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git add -A
          git diff --cached --check
          git commit -m "fix(filters): refresh generated adoption inventory"

      - name: Push only if the PR head has not moved
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ALLOW_AUTOMERGE_PUSH: "1"
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(GH_TOKEN="$GH_TOKEN" gh api user --jq .login)" = "BigSimmo"
          remote_head="$(git ls-remote origin refs/heads/claude/filter-therapy-compass | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/claude/filter-therapy-compass
