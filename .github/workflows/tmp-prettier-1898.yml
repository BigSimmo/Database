name: Temporary Prettier 1898

on:
  push:
    branches: [codex/tmp-prettier-1898-20260813]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Format target
        run: npx prettier tests/medication-interactions.test.ts --write
      - name: Verify target
        run: npx prettier tests/medication-interactions.test.ts --check
      - name: Upload formatted file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prettier-1898
          path: tests/medication-interactions.test.ts
          if-no-files-found: error
          retention-days: 1
