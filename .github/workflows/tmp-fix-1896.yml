name: Temporary fix PR 1896

on:
  push:
    branches: [codex/tmp-fix-1896-20260813]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/rag-performance-review-lpw15e
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact head
        run: |
          test "$(git rev-parse HEAD)" = "360c65454a16a42683ceedb3b1929f0326c6d05f" || {
            echo "Target branch moved; refusing to overwrite concurrent work." >&2
            exit 1
          }

      - name: Extract telemetry parser
        run: |
          python - <<'PY'
          from pathlib import Path

          rag = Path("src/lib/rag/rag.ts")
          text = rag.read_text()

          import_anchor = 'import { safeErrorLogDetails } from "@/lib/privacy";\n'
          import_line = 'import { generationFailureDetailToken } from "@/lib/rag/rag-generation-failure-detail";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("import anchor missing")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          start_marker = "  /** Extract the specific deterministic gate token behind a collapsed generation failure."
          end_marker = "  /** Build generation fallback answer. */"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("bounded parser block markers missing")
          text = text[:start] + text[end:]
          rag.write_text(text)
          PY

          cat > src/lib/rag/rag-generation-failure-detail.ts <<'EOF'
          /**
           * Extract the deterministic gate token behind a collapsed generation failure.
           *
           * The caller deliberately stores only an allow-shaped token. Provider errors,
           * answer prose and source text never leave this function.
           */
          export function generationFailureDetailToken(error: unknown): string | null {
            const message = (
              error instanceof Error ? error.message : typeof error === "string" ? error : ""
            ).toLowerCase();
            const gate = message.match(/quality gate failed: ([a-z0-9_]+)/);
            if (gate) return gate[1];
            const incomplete = message.match(/generation incomplete: ([a-z0-9_]+)/);
            if (incomplete) return incomplete[1];
            return null;
          }
          EOF

          cat > tests/rag-generation-failure-detail.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";

          import { generationFailureDetailToken } from "@/lib/rag/rag-generation-failure-detail";

          describe("generationFailureDetailToken", () => {
            it("extracts a quality-gate token without retaining surrounding text", () => {
              expect(
                generationFailureDetailToken(
                  new Error("Quality gate failed: NUMERIC_FAITHFULNESS_GAP; provider detail must not be stored"),
                ),
              ).toBe("numeric_faithfulness_gap");
            });

            it("extracts an incomplete-generation token", () => {
              expect(generationFailureDetailToken("Generation incomplete: MAX_OUTPUT_TOKENS")).toBe(
                "max_output_tokens",
              );
            });

            it("returns null for unrecognised provider text", () => {
              expect(generationFailureDetailToken(new Error("upstream returned sensitive free text"))).toBeNull();
              expect(
                generationFailureDetailToken({ message: "quality gate failed: should_not_escape" }),
              ).toBeNull();
            });
          });
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Format and verify
        run: |
          npx prettier src/lib/rag/rag.ts src/lib/rag/rag-generation-failure-detail.ts tests/rag-generation-failure-detail.test.ts --write
          npx prettier src/lib/rag/rag.ts src/lib/rag/rag-generation-failure-detail.ts tests/rag-generation-failure-detail.test.ts --check
          npx vitest run tests/rag-generation-failure-detail.test.ts
          npm run check:maintainability-budgets
          npm run typecheck

      - name: Commit exact fix
        run: |
          git config user.name "BigSimmo"
          git config user.email "87357024+BigSimmo@users.noreply.github.com"
          git add src/lib/rag/rag.ts src/lib/rag/rag-generation-failure-detail.ts tests/rag-generation-failure-detail.test.ts
          git commit -m "refactor(rag): extract generation failure telemetry parser"
          git push origin HEAD:claude/rag-performance-review-lpw15e
