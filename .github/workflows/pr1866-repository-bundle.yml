name: PR 1866 repository bundle

on:
  push:
    branches:
      - claude/plan-implementation-3t2vl5

permissions:
  contents: read

jobs:
  bundle:
    name: Export repository bundle
    if: contains(github.event.head_commit.message, '[bundle-pr1866]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create verified two-ref bundle
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git branch --force pr1866-head HEAD
          git branch --force pr1866-main refs/remotes/origin/main
          git bundle create /tmp/pr1866.bundle pr1866-head pr1866-main
          git bundle verify /tmp/pr1866.bundle

      - name: Upload repository bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr1866-repository-bundle-${{ github.run_id }}
          path: /tmp/pr1866.bundle
          if-no-files-found: error
          retention-days: 1
