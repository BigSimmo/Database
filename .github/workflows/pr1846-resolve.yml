name: PR 1846 Conflict Resolver

on:
  push:
    branches:
      - claude/filter-popup-design-mockups-x6sbjv

concurrency:
  group: pr1846-conflict-resolver
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/filter-popup-design-mockups-x6sbjv
          fetch-depth: 0

      - name: Merge latest main with repository ledger driver
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.ledger.driver 'node scripts/merge-branch-review-ledger.mjs %O %A %B'
          git config merge.ledger.name 'branch-review-ledger union with exact-row dedupe'

          node scripts/merge-branch-review-ledger.mjs --self-test
          git fetch origin main
          git merge --no-commit --no-ff origin/main

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            echo "Unexpected unresolved conflicts:"
            printf '%s\n' "$conflicts"
            exit 1
          fi

          node scripts/check-branch-review-ledger.mjs
          git diff --check

          git rm .github/workflows/pr1846-resolve.yml
          git commit -m "Merge main into PR #1846 and resolve ledger conflict"
          git push origin HEAD:claude/filter-popup-design-mockups-x6sbjv
