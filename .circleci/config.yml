# See: https://circleci.com/docs/reference/configuration-reference/
# Note: CircleCI config v2.1 treats the double left-angle merge marker as a
# special tag — never use shell heredocs in run steps.
version: 2.1

jobs:
  verify:
    docker:
      # Node >=24.11.0 is required by current lockfile packages (e.g. @babel/parser
      # engines "^22.18.0 || >=24.11.0") under .npmrc engine-strict=true.
      # cimg/node:24.9 fails npm ci immediately; 24.18 matches .nvmrc major and
      # the Cloud Agent runtime. Prefer the floating patch tag: digest pin plus
      # resource_class: small failed this project's executor before steps ran.
      - image: cimg/node:24.18
    steps:
      - checkout
      - run:
          name: Skip verification on docs-only changes
          command: |
            # CircleCI checkouts often restrict the origin fetch refspec to the
            # branch under test, so force main into the remote-tracking ref.
            if ! git fetch --depth 100 origin "main:refs/remotes/origin/main"; then
              echo "Could not fetch origin/main; running full verification."
              exit 0
            fi
            BASE_SHA="$(git rev-parse origin/main)"
            HEAD_SHA="$(git rev-parse HEAD)"
            # Reuse scripts/ci-change-scope.mjs so policy-bearing Markdown
            # (AGENTS.md, .github/pull_request_template.md, docs/codex-review-protocol.md, …)
            # is not false-greened as docs-only.
            node scripts/ci-change-scope.mjs --base "$BASE_SHA" --head "$HEAD_SHA" | tee /tmp/ci-change-scope.txt
            if grep -qx 'docs_only=true' /tmp/ci-change-scope.txt; then
              echo "Docs-only change (ci-change-scope); skipping install and verification."
              circleci-agent step halt
            else
              echo "Non-docs changes detected; running verification."
            fi
      - run:
          name: Assert node/npm engine majors
          # Image-bundled npm 11.x satisfies package.json engines; avoid non-root
          # global reinstalls (cimg installs Node under /usr/local).
          command: |
            node --version
            npm --version
            node -e 'const major=Number(process.version.slice(1).split(".")[0]); if(major!==24){console.error("expected node 24.x, got",process.version); process.exit(1)}'
            node -e 'const {execSync}=require("node:child_process"); const v=execSync("npm --version",{encoding:"utf8"}).trim(); if(!/^11\./.test(v)){console.error("expected npm 11.x, got",v); process.exit(1)}'
            node -e 'const [maj,min]=process.versions.node.split(".").map(Number); if(maj===24 && min<11){console.error("lockfile requires Node >=24.11.0 under engine-strict; got",process.versions.node); process.exit(1)}'
      - restore_cache:
          keys:
            - npm-deps-v2-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          no_output_timeout: 15m
          command: npm ci
      - save_cache:
          key: npm-deps-v2-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Format check
          command: npm run format:check
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Typecheck
          command: npm run typecheck
      - run:
          name: Install deterministic Python PDF test prerequisite
          # Same PyMuPDF pin as .github/workflows/ci.yml. cimg/base only ships
          # python-is-python3 (no pip), and Ubuntu 24.04 blocks system pip installs
          # (PEP 668), so bootstrap a venv and point PYTHON_BIN at it for tests.
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-pip python3-venv
            python3 -m venv /tmp/ci-pdf-venv
            /tmp/ci-pdf-venv/bin/pip install --disable-pip-version-check "PyMuPDF==1.28.0"
            /tmp/ci-pdf-venv/bin/python -c "import fitz; print('PyMuPDF', fitz.version)"
      - run:
          name: Unit tests
          environment:
            PYTHON_BIN: /tmp/ci-pdf-venv/bin/python
          command: npm run test

workflows:
  verify:
    jobs:
      - verify
