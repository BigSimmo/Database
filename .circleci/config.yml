# See: https://circleci.com/docs/reference/configuration-reference/
# Note: CircleCI config v2.1 treats the double left-angle merge marker as a
# special tag — never use shell heredocs in run steps.
version: 2.1

jobs:
  npm-ping:
    docker:
      - image: cimg/node:24.9
    steps:
      - checkout
      - run:
          name: npm ping
          command: npm ping

  engine-check:
    docker:
      - image: cimg/node:24.9
    steps:
      - checkout
      - run:
          name: preinstall engine check
          command: node scripts/check-node-engine.cjs

  npm-ci-dry-run:
    docker:
      - image: cimg/node:24.9
    steps:
      - checkout
      - run:
          name: npm ci dry-run
          no_output_timeout: 15m
          command: npm ci --dry-run

  npm-ci-ignore-scripts:
    docker:
      - image: cimg/node:24.9
    steps:
      - checkout
      - run:
          name: npm ci ignore-scripts
          no_output_timeout: 15m
          command: npm ci --ignore-scripts

workflows:
  verify:
    jobs:
      - npm-ping
      - engine-check
      - npm-ci-dry-run
      - npm-ci-ignore-scripts
