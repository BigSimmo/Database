# See: https://circleci.com/docs/reference/configuration-reference/
version: 2.1

jobs:
  verify:
    docker:
      # cimg/node:24.9, pinned by digest (matches package.json "engines": node 24.x).
      # Re-resolve with: curl -s https://registry-1.docker.io/v2/cimg/node/manifests/24.9 -H "Authorization: Bearer $(curl -s 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:cimg/node:pull' | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')" -H "Accept: application/vnd.oci.image.index.v1+json" -D - -o /dev/null
      - image: cimg/node:24.9@sha256:4729cd041e58fd288a12475aa011b7b62c58d351703813e6b7e0746a701e9602
    # Lint/typecheck/test/format don't need more than the default docker executor.
    resource_class: small
    steps:
      - checkout
      - run:
          name: Skip verification on docs-only changes
          command: |
            git fetch --depth 100 origin main
            BASE_SHA="$(git rev-parse origin/main)"
            HEAD_SHA="$(git rev-parse HEAD)"
            # Reuse scripts/ci-change-scope.mjs so policy-bearing Markdown
            # (AGENTS.md, .github/pull_request_template.md, docs/codex-review-protocol.md, …)
            # is not false-greened as docs-only.
            node scripts/ci-change-scope.mjs --base "$BASE_SHA" --head "$HEAD_SHA" | tee /tmp/ci-change-scope.txt
            if grep -qx 'docs_only=true' /tmp/ci-change-scope.txt; then
              echo "Docs-only change (ci-change-scope); skipping install and verification."
              circleci-agent step halt
            else
              echo "Non-docs changes detected; running verification."
            fi
      - run:
          name: Assert npm matches engines-required 11.x
          # cimg/node installs Node under /usr/local; non-root `npm install -g` fails without sudo.
          # The image already ships npm 11.x with Node 24.9 — assert rather than reinstall.
          command: |
            npm --version
            node -e 'const major=Number(process.version.slice(1).split(".")[0]); if(major!==24){console.error("expected node 24.x, got",process.version); process.exit(1)}'
            node -e 'const {execSync}=require("node:child_process"); const v=execSync("npm --version",{encoding:"utf8"}).trim(); if(!/^11\./.test(v)){console.error("expected npm 11.x, got",v); process.exit(1)}'
      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          # Guards this one step: `npm ci` is the step most exposed to a stalled/slow registry.
          no_output_timeout: 15m
          command: npm ci
      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Format check
          command: npm run format:check
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Typecheck
          command: npm run typecheck
      - run:
          name: Install deterministic Python PDF test prerequisite
          # Same PyMuPDF pin as .github/workflows/ci.yml. cimg/base only ships
          # python-is-python3 (no pip), so bootstrap pip first.
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-pip
            python3 -m pip install --disable-pip-version-check "PyMuPDF==1.28.0"
      - run:
          name: Unit tests
          command: npm run test

workflows:
  verify:
    jobs:
      - verify
