# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration.
#
# Intent: keep normal automatic review and chat enabled while ensuring a
# CodeRabbit service error cannot make its advisory progress surface fail.
reviews:
  auto_review:
    enabled: true
  # Keep legacy commit-status mirroring disabled. Normal review progress uses
  # CodeRabbit's current progress surface and remains non-failing below.
  commit_status: false
  fail_commit_status: false
chat:
  auto_reply: true
